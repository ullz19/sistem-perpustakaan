services:
  web:
    build: .
    image: modul-web:1.0
    container_name: web
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      - POSTGRES_USER=modul
      - POSTGRES_PASSWORD=contoh-saja-bukan-asli
      - POSTGRES_DB=modul_db
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modul -d modul_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:
